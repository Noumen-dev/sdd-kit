# Проверка заголовка PR (Conventional Commits) и запрет base=dev (политика по умолчанию).
# Consumer может ослабить forbid-dev через Project override — тогда удалите/измените job.
name: pr-governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-governance:
    name: pr-governance
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Forbid base branch dev
        run: |
          if [ "${{ github.base_ref }}" = "dev" ]; then
            echo "::error::PR в ветку dev запрещён политикой sdd-kit (по умолчанию). Откройте PR в main или ослабьте workflow в consumer."
            exit 1
          fi
          echo "base=${{ github.base_ref }} — ok"

      - name: Conventional Commits PR title
        uses: amannn/action-semantic-pull-request@v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            chore
            ci
            perf
            revert
          requireScope: false
