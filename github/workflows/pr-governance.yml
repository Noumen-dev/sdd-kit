# Проверка заголовка PR (Conventional Commits).
# Имя базы dev не запрещено: защита — любая protected-ветка. Прод — main.
# Локальных git-hooks нет: разработчик проходит эти правила на GitHub.
name: pr-governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-governance:
    name: pr-governance
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Record PR base
        run: echo "base=${{ github.base_ref }} — имя ветки само по себе не ошибка"

      - name: Conventional Commits PR title
        uses: amannn/action-semantic-pull-request@v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            chore
            ci
            perf
            revert
          requireScope: false
